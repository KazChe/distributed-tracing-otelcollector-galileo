dist:
  module: github.com/KazChe/distributed-tracing-otelcollector-galileo/collector
  name: galileo-otel-collector
  description: "Galileo AI Observability Collector — custom distribution with Galileo router and exporter"
  output_path: ./output
  version: "0.1.0"

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.148.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.148.0
  - gomod: github.com/KazChe/distributed-tracing-otelcollector-galileo/collector/processor/galileorouterprocessor v0.1.0
    path: ../processor/galileorouterprocessor

exporters:
  - gomod: github.com/KazChe/distributed-tracing-otelcollector-galileo/collector/exporter/galileoexporter v0.1.0
    path: ../exporter/galileoexporter
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.148.0

extensions:
  - gomod: go.opentelemetry.io/collector/extension/zpagesextension v0.148.0

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.54.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.54.0
